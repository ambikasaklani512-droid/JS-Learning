<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }


        .container {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }


        h1 {
            margin-bottom: 30px;
            color: #333;
        }

        .countdown {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #000;
            border-radius: 7%;
            width: 150px;
            padding: 14px 10px;
            background-color: #beb5b5;
            font-weight: 600;
            font-size: 40px;
            box-shadow: inset;
        }

        button {
            padding: 14px 30px;
            margin: 30px;
            border: 3px solid #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 30px;
            color: white;
            background: #667eea;
        }


        button:hover {
            background: #4c5fd5;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>COUNTDOWN STARTS HERE!</h1>
        <div class="countdown">
        </div>
        <button>Start</button>
    </div>
    <script src="countdown.js"></script>
</body>

</html>
