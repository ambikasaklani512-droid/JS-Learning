<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouseover</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body{
            width: 100%;
            height: 100%;
            background-color: #222;
        }
        body{
            /* these properties must always be applied to div not body */
            overflow: hidden;
            position: relative;
        }
        .box{
            position: absolute;
            width: 250px;
            height: 250px;
            background-color: red;
            transition: all cubic-bezier(0.19, 1, 0.22, 1) 0.2s;
        }
    </style>
</head>
<body>
    <div class="box">
    </div>
    <script src="mouseover_mouseout.js"></script>
</body>
</html>
