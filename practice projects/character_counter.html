<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHARACTER COUNTER</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:'Courier New', Courier, monospace;
        }
        html,body{
            width: 100%;
            height: 100%;
            background-color: #222;
        }
        div{
            color: #fff;
            padding: 5%;
        }
        h1{
            display: flex;
            justify-content: center;
            padding-bottom: 3%;
            font-size: 50px;
        }
        input{
            font-size: 30px;
            width: 80%;
            padding: 5px;
        }
        p{
            font-size: 20px;
            padding: 10px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div>
        <h1>Character Counter</h1>
    <input id="first" type="text" placeholder="write anything..."> 
    <p>Max Characters : <span class="maxcount">0</span>/30</p>
    </div>
    <div>
        <h1>Character Counter</h1>
    <input id="second" type="text" placeholder="write anything..."> 
    <p>Characters Left : <span class="leftcount">0</span>/30</p>
    </div>
    <script src="character_counter.js"></script>
</body>
</html>
