<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Simulator</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
    width:420px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    color:#333;
    margin-bottom:30px;
}

.progress-container{
    width:100%;
    height:25px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:linear-gradient(to right,#36d1dc,#5b86e5);
    border-radius:20px;
    transition:width 0.3s ease;
}

#percentage{
    margin:20px 0;
    color:#444;
    font-size:32px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#4facfe;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#2196f3;
}

button:active{
    transform:scale(0.98);
}

#status{
    margin-top:20px;
    color:#666;
    font-size:18x;
    font-weight: 600;
}
    </style>
</head>
<body>

    <div class="container">

        <h1>Download Simulator</h1>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <h2 id="percentage">0%</h2>

        <button id="downloadBtn">
            Start Download
        </button>

        <p id="status">
            Waiting to start...
        </p>

    </div>

    <script src="download_simulatorui.js"></script>

</body>
</html>
