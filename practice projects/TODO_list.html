<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:'Courier New', Courier, monospace;
        }
        html,body{
            width: 100%;
            height: 100%;
            background-color: #222;
        }
        #list{
            color: #fff;
            padding-top: 5%;
        }
        h1{
            display: flex;
            justify-content: center;
            padding-bottom: 3%;
            font-size: 50px;
        }
        ul{
            padding-left: 10%;
        }
        li{
            font-size: 40px;
            user-select: none;
        }
        .lt{
            text-decoration: line-through;
        }
    </style>
</head>

<body>
    <div id="list">
        <h1>TO DO List</h1>
    <ul>
        <li>apple</li>
        <li>mango</li>
        <li>banana</li>
        <li>cherry</li>
        <li>pineapple</li>
        <li>pear</li>
    </ul>
    </div>
<script src="todo_list.js"></script>
</body>

</html>
