<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="cards_stack.css">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>

    <div class="container">

        <div class="heading">
            <h1>Find your call notes at one place</h1>
        </div>

        <div id="cardscontainer">
            <!-- Left Buttons -->
            <div class="actions">
                <button><i id="addBtn" class="ri-add-line"></i></button>
                <button><i id="upBtn" class="ri-arrow-up-line"></i></button>
                <button><i id="downBtn" class="ri-arrow-down-line"></i></button>
            </div>

            <!-- Card Stack -->
            <div class="card-stack">

                <!-- <div class="card">

                    <img src="https://i.pravatar.cc/100?img=12" alt="">

                    <h2>Rebecca</h2>

                    <div class="info">
                        <span>Home town</span>
                        <span>Indore</span>
                    </div>

                    <div class="info">
                        <span>Purpose</span>
                        <span>Quick Call for Appointment</span>
                    </div>

                    <div class="buttons">
                        <button class="call">
                            <i class="ri-phone-line"></i>
                            Call
                        </button>

                        <button class="msg">
                            Message
                        </button>
                    </div>

                </div> -->

            </div>

        </div>

    </div>


    <div class="form-container">

        <h2>New Call</h2>

        <form>

            <div class="form-group">
                <label>Image URL</label>
                <input required type="text" placeholder="https://example.com/photo.jpg">
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input required type="text" placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label>Home Town</label>
                <input required type="text" placeholder="Enter home town">
            </div>

            <div class="form-group">
                <label>Purpose</label>
                <input required type="text" placeholder="e.g., Quick appointment note">
            </div>

            <div class="form-group">
                <label>Category</label>

                <div class="radio-group">
                    <label><input required type="radio" name="category" value="Emergency"> Emergency</label>
                    <label><input required type="radio" name="category" value="Important"> Important</label>
                    <label><input required type="radio" name="category" value="Urgent"> Urgent</label>
                    <label><input required type="radio" name="category" value="no Rush"> No Rush</label>
                </div>
            </div>

            <button class="create-btn">Create Note</button>

            <button class="close-btn" type="button">Close</button>

        </form>

    </div>

    <script src="cards_stack.js"></script>
</body>

</html>
