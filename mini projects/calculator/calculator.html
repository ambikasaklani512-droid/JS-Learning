<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: 0;
    }

    body,
    html {
        width: 100%;
        height: 100%;
        background-color: rgb(55, 55, 55);
    }

    .container h1 {
        font-size: 56px;
    }

    .calculator-div {
        border-radius: 20px;
        width: 45%;
    }

    input {
        box-shadow: inset 0 8px 10px rgba(0, 0, 0, 0.3);
        background: #c5c3c3fb;
        font-size: 38px;
        color: #555;
    }

    .buttons button {
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        width: 90px;
        padding: 20px 50px;
        font-size: 30px;
        font-weight: 600;
        box-sizing: border-box;
    }

    #eql_btn {
        background-color: rgb(238, 120, 77);
    }

    #eql_btn:hover {
        background-color: rgb(205, 68, 18);
    }

    #del_btn {
        background-color: #2b6dcd;
        border: none;
        padding: 20px 50px;
    }

    #del_btn:hover {
        background-color: #193968;
    }

    #operator_btn {
        background-color: #394e74;
        border: none;
        padding: 20px 50px;
        text-align: center;
    }

    #operator_btn:hover {
        background-color: #2c3c5b;
    }
</style>

<body>
    <div class="conatiner-fluid">
        <div class="container pb-5">
            <h1 class="text-center text-light py-5">Calculator</h1>
            <div class="calculator-div bg-dark mx-auto p-5 shadow-lg">
                <input type="'text'" class="text-end w-100 p-4">
                <div class="buttons row row-cols-4 w-60 my-4 g-4">
                    <div class="col">
                        <button type="button" id="operator_btn" class="btn btn-secondary">AC</button>
                    </div>
                    <div class="col">
                        <button type="button" id="del_btn" class="btn btn-secondary col">DEL</button>
                    </div>
                    <div class="col">
                        <button type="button" id="operator_btn" class="btn btn-secondary col">%</button>
                    </div>
                    <div class="col">
                        <button type="button" id="operator_btn" class="btn btn-secondary col">/</button>
                    </div>
                    <div class="col">
                        <button type="button" class="btn btn-secondary col">7</button>
                    </div>
                    <div class="col">
                        <button type="button" class="btn btn-secondary col">8</button>
                    </div>
                    <div class="col">
                        <button type="button" class="btn btn-secondary col">9</button>
                    </div>
                    <div class="col">
                        <button type="button" id="operator_btn" class="btn btn-secondary col">*</button>
                    </div>
                    <div class="col">
                        <button type="button" class="btn btn-secondary col">4</button>
                    </div>
                    <div class="col">
                        <button type="button" class="btn btn-secondary col">5</button>
                    </div>
                    <div class="col">
                        <button type="button" class="btn btn-secondary col">6</button>
                    </div>
                    <div class="col">
                        <button type="button" id="operator_btn" class="btn btn-secondary col">-</button>
                    </div>
                    <div class="col">
                        <button type="button" class="btn btn-secondary col">1</button>
                    </div>
                    <div class="col">
                        <button type="button" class="btn btn-secondary col">2</button>
                    </div>
                    <div class="col">
                        <button type="button" class="btn btn-secondary col">3</button>
                    </div>
                    <div class="col">
                        <button type="button" id="operator_btn" class="btn btn-secondary col">+</button>
                    </div>
                    <div class="col">
                        <button type="button" class="btn btn-secondary col">0</button>
                    </div>
                    <div class="col">
                        <button type="button" class="btn btn-secondary col">.</button>
                    </div>
                    <div class="col">
                        <button type="button" id="eql_btn" class="btn btn-secondary col">=</button>
                    </div>
                    <div class="col">
                        <button type="button" id="operator_btn" class="btn btn-secondary col">**</button>
                    </div>
                    

                </div>>
            </div>
        </div>
    </div>

    <script src="calculator.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
