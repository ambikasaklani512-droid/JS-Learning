<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopwatch</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #141e30, #243b55);
    }

    .stopwatch {
      width: 350px;
      padding: 40px 30px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin-bottom: 25px;
      color: #333;
    }

    #display {
      font-size: 45px;
      font-weight: bold;
      color: #222;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    #start {
      background: #28a745;
    }

    #pause {
      background: #ffc107;
      color: #222;
    }

    #reset {
      background: #dc3545;
    }
  </style>
</head>

<body>

  <div class="stopwatch">
    <h1>Stopwatch</h1>

    <div id="display">00:00:00</div>

    <div class="buttons">
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  <script src="stopwatch.js"></script>

</body>
</html>
