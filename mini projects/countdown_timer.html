<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
}


.container {
    background: white;
    padding: 35px;
    border-radius: 15px;
    text-align: center;
    width: 450px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}


h1 {
    margin-bottom: 30px;
    color: #333;
}


.timer {
    display: flex;
    justify-content: space-between;
    gap: 15px;
}


.box {
    background: #222;
    color: white;
    padding: 20px;
    border-radius: 10px;
    width: 80px;
}


.box span {
    font-size: 30px;
    font-weight: bold;
}


.box p {
    margin-top: 8px;
    font-size: 14px;
    color: #ddd;
}


.controls {
    margin-top: 30px;
}


input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 2px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}


button {
    padding: 12px 20px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    color: white;
    background: #667eea;
}


button:hover {
    background: #4c5fd5;
}


#resetBtn {
    background: #dc3545;
}


#resetBtn:hover {
    background: #b02a37;
}


#message {
    margin-top: 20px;
    color: #28a745;
}
    </style>
</head>
<body>

    <div class="container">

        <h1>Countdown Timer</h1>

        <div class="timer">
            <div class="box">
                <span id="days">00</span>
                <p>Days</p>
            </div>

            <div class="box">
                <span id="hours">00</span>
                <p>Hours</p>
            </div>

            <div class="box">
                <span id="minutes">00</span>
                <p>Minutes</p>
            </div>

            <div class="box">
                <span id="seconds">00</span>
                <p>Seconds</p>
            </div>
        </div>

        <div class="controls">
            <input type="datetime-local" id="dateInput">

            <button id="startBtn">
                Start Timer
            </button>

            <button id="resetBtn">
                Reset
            </button>
        </div>

        <h3 id="message"></h3>

    </div>

    <script src="countdown_timer.js"></script>

</body>
</html>
